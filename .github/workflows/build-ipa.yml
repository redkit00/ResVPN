name: Build ResVPN v3 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4

      - name: ResVPN v3 paketini ac
        run: |
          rm -rf src
          mkdir src
          unzip "ResVPN_Windows_IPA_Paketi_v31_DNS_FIX.zip" -d src
          ls -la src

      - name: ResVPN v3 derle
        run: |
          cd src

          xcodebuild \
            -project ResVPN.xcodeproj \
            -target ResVPN \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            clean build

      - name: IPA olustur
        run: |
          cd src
          rm -rf Payload
          mkdir Payload
          cp -R build/ResVPN.app Payload/
          zip -qry ResVPN-v3-unsigned.ipa Payload

      - name: IPA yukle
        uses: actions/upload-artifact@v4
        with:
          name: ResVPN-v3-IPA
          path: src/ResVPN-v3-unsigned.ipa
